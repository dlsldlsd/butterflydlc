<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная оплата — Butterfly DLC</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f13; --card-bg: #1a1a22; --text: #ffffff; --text-dim: #a0a0b0; --accent: #8b5cf6; --border: #2a2a35; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 60%); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 50px 40px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .logo { height: 60px; width: 60px; border-radius: 12px; margin-bottom: 20px; }
        .icon { font-size: 60px; margin-bottom: 20px; display: block; }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 15px; color: var(--success); }
        p { font-size: 15px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 800; text-decoration: none; transition: 0.3s; margin-bottom: 15px; }
        .btn:hover { background: #7c3aed; transform: translateY(-2px); }
        .tg-btn { background: #229ED9; box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3); }
        .tg-btn:hover { background: #1e8bc0; }
        .link { color: var(--text-dim); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="Logo" class="logo">
        <span class="icon">✅</span>
        <h2>Оплата прошла успешно!</h2>
        <p>Спасибо за покупку! Чтобы мы активировали вашу подписку, пожалуйста, напишите нам в Telegram и пришлите чек об оплате.</p>
        
        <!-- ЗАМЕНИ ССЫЛКУ НА СВОЙ ТЕЛЕГРАМ! -->
        <a href="https://t.me/твой_ник_в_телеграме" target="_blank" class="btn tg-btn">Написать в поддержку</a>
        
        <a href="/dashboard" class="btn" style="background: transparent; border: 1px solid var(--border); color: var(--text);">Перейти в кабинет</a>
        <a href="/" class="link">← На главную</a>
    </div>
</body>
</html>
